[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepwealth-agent"
version = "0.1.0"
description = "SleepWealth Agent: governed paper-trading and simulation research shell."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sleepwealth-agent = "cli.main:app"
sleepwealth-race = "cli.race:app"
trading-agent = "cli.main:app"
trading-race = "cli.race:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["approvals*", "audit*", "broker*", "cli*", "engine*", "execution*", "gate*", "portfolio*", "race*", "risk*", "rules*"]

[tool.setuptools.package-data]
rules = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
