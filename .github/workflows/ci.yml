name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind proof to exact head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"

      - name: Gate main pushes by merged-PR provenance
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_PROVENANCE_RECEIPT: artifacts/main-provenance-ci.json
        run: python governance/main_provenance.py

      - name: Upload CI provenance receipt
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ci-main-provenance-receipt
          path: artifacts/main-provenance-ci.json
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate rules
        run: python -m cli.main validate

      - name: Critical lint
        run: ruff check . --select E4,E7,E9,F

      - name: Test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: pytest tests/ -v --tb=short

      - name: External crypto observer boundaries
        run: pytest tests/test_external_crypto_sources.py tests/test_external_crypto_http.py -v --tb=short

      - name: SideShift public catalog probe
        run: |
          python - <<'PY'
          import json
          from backend.external_observers import get_sideshift_public_catalog

          result = get_sideshift_public_catalog()
          catalog = result["catalog"]
          assert result["status"] == "ok", result
          assert result["lane"] == "crypto"
          assert result["mode"] == "public-coin-catalog"
          assert result["read_only"] is True
          assert result["authority"] == "none"
          assert result["real_money"] is False
          assert result["live_execution"] is False
          assert catalog["endpoint_scope"] == "GET /api/v2/coins only"
          assert catalog["account_secret_used"] is False
          assert catalog["wallet_connection"] is False
          assert catalog["quote_creation"] is False
          assert catalog["shift_creation"] is False
          assert catalog["coins"], result
          print(json.dumps({
              "status": result["status"],
              "coin_count": len(catalog["coins"]),
              "endpoint_scope": catalog["endpoint_scope"],
              "authority": result["authority"],
              "live_execution": result["live_execution"],
          }, indent=2))
          PY

      - name: Stock paper smoke test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: python -m cli.main run --mode paper --broker mock --lane stock-market --symbol AAPL --qty 0.04 --side buy --auto-approve

      - name: Crypto paper smoke test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: python -m cli.main run --mode paper --broker mock --lane crypto --symbol BTC-USD --qty 0.01 --side buy --auto-approve

      - name: Real read-only stock data probe
        env:
          SLEEPWEALTH_MARKET_SOURCE: yahoo-public
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import observe_lane_markets
          from market import STOCK_LANE

          result = asyncio.run(observe_lane_markets(STOCK_LANE))
          assert result["status"] == "ok", result
          assert result["lane"] == STOCK_LANE
          assert result["failed_symbols"] == []
          assert result["featured_symbols"] == ["AAPL", "MSFT", "VTI"]
          assert all(row["lane"] == STOCK_LANE for row in result["markets"])
          assert all(row["crypto_native"] is False for row in result["markets"])
          assert all(row["source"] == "yahoo-public-chart" for row in result["markets"])
          assert all(row["price"] > 0 for row in result["markets"])
          assert result["live_execution"] is False
          print(json.dumps(result, indent=2))
          PY

      - name: Real read-only crypto data probe
        env:
          SLEEPWEALTH_MARKET_SOURCE: yahoo-public
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import observe_lane_markets
          from market import CRYPTO_LANE

          result = asyncio.run(observe_lane_markets(CRYPTO_LANE))
          assert result["status"] == "ok", result
          assert result["lane"] == CRYPTO_LANE
          assert result["failed_symbols"] == []
          assert result["featured_symbols"] == ["BTC-USD", "ETH-USD", "SOL-USD"]
          assert all(row["lane"] == CRYPTO_LANE for row in result["markets"])
          assert all(row["crypto_native"] is True for row in result["markets"])
          assert all(row["instrument_type"] == "CRYPTOCURRENCY" for row in result["markets"])
          assert all(row["source"] == "yahoo-public-chart" for row in result["markets"])
          assert all(row["price"] > 0 for row in result["markets"])
          assert result["live_execution"] is False
          print(json.dumps(result, indent=2))
          PY

      - name: Real U.S. listed stock directory probe
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import search_stock_universe

          result = asyncio.run(search_stock_universe("AAPL", 10))
          assert result["status"] == "ok", result
          assert result["lane"] == "stock-market"
          assert result["source"] == "nasdaq-trader-symbol-directory"
          assert any(row["symbol"] == "AAPL" for row in result["results"]), result
          assert all(row["crypto_native"] is False for row in result["results"])
          assert result["live_execution"] is False
          print(json.dumps(result, indent=2))
          PY

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start Sleep Wealth backend
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
          SLEEPWEALTH_AUDIT_LOG: /tmp/sleepwealth-audit.log
        run: |
          python -m backend.server --host 127.0.0.1 --port 8765 >/tmp/sleepwealth-backend.log 2>&1 &
          echo $! >/tmp/sleepwealth-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/tmp/sleepwealth-health.json; then
              cat /tmp/sleepwealth-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sleepwealth-backend.log
          exit 1

      - name: Start MOM8 public preview
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory public >/tmp/mom8-preview.log 2>&1 &
          echo $! >/tmp/mom8-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8766/mom8/ >/tmp/mom8-preview.html; then
              grep -q "MOM OF 8" /tmp/mom8-preview.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mom8-preview.log
          exit 1

      - name: Start crypto sandbox wallet lab
        env:
          SLEEPWEALTH_CRYPTO_SANDBOX_CASH: "100"
        run: |
          python -m backend.crypto_sandbox_server --host 127.0.0.1 --port 8767 >/tmp/crypto-sandbox.log 2>&1 &
          echo $! >/tmp/crypto-sandbox.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8767/health >/tmp/crypto-sandbox-health.json; then
              cat /tmp/crypto-sandbox-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/crypto-sandbox.log
          exit 1

      - name: Playwright Sleep Wealth proof
        env:
          SLEEPWEALTH_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/playwright_sleepwealth.py

      - name: Playwright crypto sandbox wallet proof
        env:
          SLEEPWEALTH_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CRYPTO_SANDBOX_BASE_URL: http://127.0.0.1:8767/
        run: python tests/playwright_crypto_sandbox.py

      - name: Playwright Pump Live Box proof
        env:
          SLEEPWEALTH_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUMP_LIVE_BOX_BASE_URL: http://127.0.0.1:8768/
        run: python tests/playwright_pump_live_box.py

      - name: Playwright MOM8 public preview proof
        env:
          SLEEPWEALTH_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOM8_BASE_URL: http://127.0.0.1:8766/mom8/
        run: python tests/playwright_mom8.py

      - name: Upload Sleep Wealth Playwright proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleepwealth-playwright-proof
          path: artifacts/
          if-no-files-found: warn
