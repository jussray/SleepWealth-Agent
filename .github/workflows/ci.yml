name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate rules
        run: python -m cli.main validate

      - name: Lint
        run: ruff check .
        continue-on-error: true

      - name: Test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: pytest tests/ -v --tb=short

      - name: Paper smoke test
        run: python -m cli.main run --mode paper --broker mock --symbol AAPL --qty 0.04 --side buy --auto-approve

      - name: Real read-only market data probe
        env:
          SLEEPWEALTH_MARKET_SOURCE: yahoo-public
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import observe_approved_markets

          result = asyncio.run(observe_approved_markets())
          assert result["status"] == "ok", result
          assert result["approved_symbols"] == ["AAPL", "MSFT", "VTI"]
          assert result["failed_symbols"] == []
          assert all(row["source"] == "yahoo-public-chart" for row in result["markets"])
          assert all(row["source_classification"] == "external-public-delayed" for row in result["markets"])
          assert all(row["price"] > 0 for row in result["markets"])
          assert all(row["freshness"] == "fresh" for row in result["markets"])
          assert all(len(row["fingerprint"]) == 64 for row in result["markets"])
          assert all(row["continuity_cookie"].startswith("sw-market-v1:") for row in result["markets"])
          print(json.dumps({
              "market_source": result["market_source"],
              "markets": [
                  {
                      "symbol": row["symbol"],
                      "price": row["price"],
                      "observed_at": row["observed_at"],
                      "fingerprint": row["fingerprint"],
                  }
                  for row in result["markets"]
              ],
              "live_execution": result["live_execution"],
          }, indent=2))
          PY

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start Sleep Wealth backend
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
          SLEEPWEALTH_AUDIT_LOG: /tmp/sleepwealth-audit.log
        run: |
          python -m backend.server --host 127.0.0.1 --port 8765 >/tmp/sleepwealth-backend.log 2>&1 &
          echo $! >/tmp/sleepwealth-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/tmp/sleepwealth-health.json; then
              cat /tmp/sleepwealth-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sleepwealth-backend.log
          exit 1

      - name: Playwright Sleep Wealth proof
        run: python tests/playwright_sleepwealth.py

      - name: Upload Sleep Wealth Playwright proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleepwealth-playwright-proof
          path: artifacts/
          if-no-files-found: warn
