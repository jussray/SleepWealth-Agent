name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind proof to exact head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_head_sha=$checked_out_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate rules
        run: python -m cli.main validate

      - name: Critical lint
        run: ruff check . --select E4,E7,E9,F

      - name: Test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: pytest tests/ -v --tb=short

      - name: Stock paper smoke test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: python -m cli.main run --mode paper --broker mock --lane stock-market --symbol AAPL --qty 0.04 --side buy --auto-approve

      - name: Crypto paper smoke test
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: python -m cli.main run --mode paper --broker mock --lane crypto --symbol BTC-USD --qty 0.01 --side buy --auto-approve

      - name: Real read-only stock data probe
        env:
          SLEEPWEALTH_MARKET_SOURCE: yahoo-public
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import observe_lane_markets
          from market import STOCK_LANE

          result = asyncio.run(observe_lane_markets(STOCK_LANE))
          assert result["status"] == "ok", result
          assert result["lane"] == STOCK_LANE
          assert result["failed_symbols"] == []
          assert result["featured_symbols"] == ["AAPL", "MSFT", "VTI"]
          assert all(row["lane"] == STOCK_LANE for row in result["markets"])
          assert all(row["crypto_native"] is False for row in result["markets"])
          assert all(row["source"] == "yahoo-public-chart" for row in result["markets"])
          assert all(row["price"] > 0 for row in result["markets"])
          assert result["live_execution"] is False
          print(json.dumps(result, indent=2))
          PY

      - name: Real read-only crypto data probe
        env:
          SLEEPWEALTH_MARKET_SOURCE: yahoo-public
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import observe_lane_markets
          from market import CRYPTO_LANE

          result = asyncio.run(observe_lane_markets(CRYPTO_LANE))
          assert result["status"] == "ok", result
          assert result["lane"] == CRYPTO_LANE
          assert result["failed_symbols"] == []
          assert result["featured_symbols"] == ["BTC-USD", "ETH-USD", "SOL-USD"]
          assert all(row["lane"] == CRYPTO_LANE for row in result["markets"])
          assert all(row["crypto_native"] is True for row in result["markets"])
          assert all(row["instrument_type"] == "CRYPTOCURRENCY" for row in result["markets"])
          assert all(row["source"] == "yahoo-public-chart" for row in result["markets"])
          assert all(row["price"] > 0 for row in result["markets"])
          assert result["live_execution"] is False
          print(json.dumps(result, indent=2))
          PY

      - name: Real U.S. listed stock directory probe
        run: |
          python - <<'PY'
          import asyncio
          import json
          from backend.server import search_stock_universe

          result = asyncio.run(search_stock_universe("AAPL", 10))
          assert result["status"] == "ok", result
          assert result["lane"] == "stock-market"
          assert result["source"] == "nasdaq-trader-symbol-directory"
          assert any(row["symbol"] == "AAPL" for row in result["results"]), result
          assert all(row["crypto_native"] is False for row in result["results"])
          assert result["live_execution"] is False
          print(json.dumps(result, indent=2))
          PY

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start Sleep Wealth backend
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
          SLEEPWEALTH_AUDIT_LOG: /tmp/sleepwealth-audit.log
        run: |
          python -m backend.server --host 127.0.0.1 --port 8765 >/tmp/sleepwealth-backend.log 2>&1 &
          echo $! >/tmp/sleepwealth-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/tmp/sleepwealth-health.json; then
              cat /tmp/sleepwealth-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sleepwealth-backend.log
          exit 1

      - name: Playwright Sleep Wealth proof
        run: python tests/playwright_sleepwealth.py

      - name: Upload Sleep Wealth Playwright proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleepwealth-playwright-proof
          path: artifacts/
          if-no-files-found: warn
