name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate rules
        run: python -m cli.main validate

      - name: Critical lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v --tb=short

      - name: Simulation smoke test
        run: python -m cli.main run --mode paper --broker mock --symbol AAPL --qty 0.04 --side buy --auto-approve

      - name: Live mode must fail closed
        run: |
          if python -m cli.main run --mode live --broker mock --symbol AAPL --qty 0.04 --side buy --auto-approve; then
            echo "live mode unexpectedly succeeded"
            exit 1
          fi
