name: vercel runtime bundle

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Bind bundle to successful CI head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          echo "exact_bundle_sha=$checked_out_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Vercel runtime
        run: python scripts/package_vercel_runtime.py

      - name: Verify bundle identity and authority ceiling
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/vercel-runtime/runtime-bundle.json").read_text())
          assert manifest["source_sha"] == os.environ["EXPECTED_HEAD_SHA"]
          assert manifest["live_execution"] is False
          assert manifest["real_money"] is False
          assert "broker/alpaca.py" in manifest["forbidden_runtime_paths"]
          assert "broker/ibkr.py" in manifest["forbidden_runtime_paths"]
          print(json.dumps({
              "source_sha": manifest["source_sha"],
              "fingerprint": manifest["fingerprint"],
              "authority_ceiling": manifest["authority_ceiling"],
          }, indent=2))
          PY

      - name: Upload exact-head Vercel runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: sleepwealth-vercel-runtime-${{ github.event.workflow_run.head_sha }}
          path: artifacts/vercel-runtime/
          if-no-files-found: error
