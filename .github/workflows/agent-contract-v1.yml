name: Agent Contract v1
on:
  push:
    paths: ['.control-room/agent-contract.v1.json','.github/workflows/agent-contract-v1.yml','AGENTS.md','REPAIR_AUTHORITY.md','GLOBAL_AI.md','CLAUDE.md','docs/**','artifacts/l99/**','.control-room/COUNCIL.md']
  pull_request:
    paths: ['.control-room/agent-contract.v1.json','.github/workflows/agent-contract-v1.yml','AGENTS.md','REPAIR_AUTHORITY.md','GLOBAL_AI.md','CLAUDE.md','docs/**','artifacts/l99/**','.control-room/COUNCIL.md']
permissions: {contents: read}
jobs:
  verify-agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify juss/agent-contract@v1
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),p='.control-room/agent-contract.v1.json';const fail=m=>{console.error(`agent-contract-v1: ${m}`);process.exit(1)};if(!fs.existsSync(p))fail(`missing ${p}`);const c=JSON.parse(fs.readFileSync(p,'utf8'));if(c.contract!=='juss/agent-contract@v1'||c.version!==1||c.status!=='active')fail('identity/version/status drift');if(c.binding?.repository!==process.env.GITHUB_REPOSITORY)fail('repository binding mismatch');if(c.binding?.defaultBranch!=='main')fail('default branch drift');if(c.binding?.canonicalSchema!=='github:jussray/founder-control-room/contracts/juss-agent-contract-v1.schema.json')fail('schema provenance drift');if(c.binding?.schemaRequiredAtRuntime!==false||c.binding?.runtimeDependencyOnPeers!==false)fail('cross-repository runtime dependency forbidden');const d=crypto.createHash('sha256').update(JSON.stringify(c.kernel)).digest('hex');if(c.kernelFingerprint!==`sha256:${d}`)fail('kernel fingerprint mismatch');const exact=(a,e,l)=>{if(JSON.stringify(a)!==JSON.stringify(e))fail(`${l} drifted`)};exact(c.kernel?.controlModel,['DECLARE','PERMIT','ATTEMPT','RECORD','PROVE','DECIDE'],'control model');exact(c.kernel?.truthClassifications,['VERIFIED','INFERRED','UNKNOWN','BLOCKED'],'truth classifications');exact(c.kernel?.returnContract,['REALITY','FIX','PROOF','RISK','ROLLBACK','NEXT GATE'],'return contract');for(const n of ['humanAuthorityIsRoot','intentIsNotAuthority','capabilityIsNotPermission','planIsNotAction','actionIsNotOutcomeProof','receiptIsNotOutcomeProof','evidenceIsNotDecision','providerSuccessIsNotOutcomeTruth','consensusDoesNotAuthorizeMutation','mutationRequiresBoundAuthority','ambiguousMutationRequiresReconciliation','staleProofCannotCarryForward','localStricterRulesWin','rollbackOrSafeContinuationRequired'])if(c.kernel?.invariants?.[n]!==true)fail(`invariant disabled: ${n}`);const o=c.binding?.localOverlays;if(!Array.isArray(o)||!o.length)fail('local overlays missing');for(const x of o)if(typeof x!=='string'||x.startsWith('/')||x.includes('..')||!fs.existsSync(x))fail(`invalid/missing local overlay: ${String(x)}`);if(!String(c.binding?.authorityRule??'').includes('no merge'))fail('authority separation missing');console.log(`agent-contract-v1 VERIFIED ${process.env.GITHUB_REPOSITORY} ${c.kernelFingerprint}`);
          NODE
