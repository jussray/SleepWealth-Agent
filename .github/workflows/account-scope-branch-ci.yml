name: Account Scope Branch Checks

on:
  push:
    branches:
      - claude/ai-runtime-repos-automation-uhpoz6
    paths:
      - "execution/account_models.py"
      - "execution/receipt_issuer.py"
      - "gate/account_scope_preflight.py"
      - "tests/test_account_models.py"
      - "tests/test_account_identity_binding.py"
      - "tests/test_account_mode_receipt_boundaries.py"
      - "tests/test_receipt_issuer.py"
      - "tests/test_account_scope_preflight.py"
      - ".github/workflows/account-scope-branch-ci.yml"

permissions:
  contents: read

concurrency:
  group: account-scope-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact-head proof
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Critical Python lint
        run: ruff check execution/account_models.py execution/receipt_issuer.py gate/account_scope_preflight.py tests/test_account_models.py tests/test_account_identity_binding.py tests/test_account_mode_receipt_boundaries.py tests/test_receipt_issuer.py tests/test_account_scope_preflight.py --select E4,E7,E9,F
      - name: Account authorization regression tests
        env:
          SLEEPWEALTH_MARKET_SOURCE: mock
        run: pytest -q tests/test_account_models.py tests/test_account_identity_binding.py tests/test_account_mode_receipt_boundaries.py tests/test_receipt_issuer.py tests/test_account_scope_preflight.py
